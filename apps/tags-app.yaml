apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tags
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gangeddulagouthamreddy/gitops.config.apps
    targetRevision: master
    path: tags
  destination:
    server: https://kubernetes.default.svc
    namespace: tags
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
